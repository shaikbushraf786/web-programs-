
<!DOCTYPE html>
<html>
<head>
    <title>Railway Reservation System</title>

    <style>
        body {
            font-family: Arial;
            background-color: #eaf2f8;
            margin: 0;
        }

        header {
            background-color: darkblue;
            color: white;
            text-align: center;
            padding: 20px;
        }

        img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .container {
            background-color: white;
            width: 80%;
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
        }

        input, select {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            background-color: green;
            color: white;
            padding: 12px;
            border: none;
            width: 100%;
            cursor: pointer;
        }

        #result {
            background-color: lightyellow;
            padding: 15px;
            margin-top: 15px;
        }

        footer {
            background-color: darkblue;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>INDIAN RAILWAY RESERVATION</h1>
    <p>Book Your Train Tickets Easily</p>
</header>

<img src="https://placehold.co/1200x350/24476b/ffffff?text=Indian+Railway+Express+Train"
     alt="Railway Train">

<div class="container">

    <h2>Passenger Details</h2>

    <label>Passenger Name:</label>
    <input type="text" id="name" placeholder="Enter name">

    <label>Age:</label>
    <input type="number" id="age" placeholder="Enter age">

    <label>Travel Distance (KM):</label>
    <input type="number" id="distance" placeholder="Enter distance">

    <label>Travel Class:</label>
    <select id="class">
        <option value="1">Sleeper</option>
        <option value="2">AC 3 Tier</option>
        <option value="3">AC 2 Tier</option>
        <option value="4">AC First Class</option>
    </select>

    <label>Number of Passengers:</label>
    <input type="number" id="passengers"
           placeholder="Enter passengers" value="1">

    <button onclick="calculateFare()">Calculate Fare</button>

    <div id="result"></div>

</div>

<footer>
    <p>Thank You for Choosing Indian Railways!</p>
</footer>

<script>

function calculateFare() {

    let name = document.getElementById("name").value;
    let age = Number(document.getElementById("age").value);
    let distance = Number(document.getElementById("distance").value);
    let travelClass = Number(document.getElementById("class").value);
    let passengers = Number(document.getElementById("passengers").value);

    if (name == "" || age <= 0 || distance <= 0 ||
        passengers <= 0 || !Number.isInteger(passengers)) {
        alert("Please enter valid details!");
        return;
    }

    let rate;

    if (travelClass == 1)
        rate = 1;
    else if (travelClass == 2)
        rate = 2;
    else if (travelClass == 3)
        rate = 3;
    else
        rate = 4;

    let baseFare = distance * rate;

    // Age-based concession (example rules)
    let concession = 0;

    if (age >= 60)
        concession = 40;
    else if (age <= 12)
        concession = 50;

    // Maximum concession limit
    if (concession > 50)
        concession = 50;

    let discount = baseFare * concession / 100;
    let finalFare = baseFare - discount;

    let totalFare = finalFare * passengers;

    let className = ["", "Sleeper", "AC 3 Tier",
                     "AC 2 Tier", "AC First Class"];

    document.getElementById("result").innerHTML =
        "<h3>RAILWAY TICKET BILL</h3>" +
        "Passenger Name: " + name + "<br><br>" +
        "Age: " + age + "<br><br>" +
        "Distance: " + distance + " KM<br><br>" +
        "Travel Class: " + className[travelClass] + "<br><br>" +
        "Passengers: " + passengers + "<br><br>" +
        "Base Fare per Passenger: ₹" + baseFare.toFixed(2) + "<br><br>" +
        "Concession: " + concession + "%<br><br>" +
        "Discount per Passenger: ₹" + discount.toFixed(2) + "<br><br>" +
        "Final Fare per Passenger: ₹" + finalFare.toFixed(2) + "<br><br>" +
        "<h3>Total Amount: ₹" + totalFare.toFixed(2) + "</h3>";

}

</script>

</body>
</html>
